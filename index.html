<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e4e2de" />
    <meta name="description" content="Paul Giron" />
    <title>PaulGiron.com</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>
    <div class="identity">
      <h1>PaulGiron.com</h1>
      <a class="contact" href="https://tally.so/r/OQaeMg" target="_blank" rel="noopener">
        <svg viewBox="0 0 112 44" preserveAspectRatio="none" aria-hidden="true">
          <path d="M3 21C2 33 9 40 20 41 19 46 17 51 13 55 19 52 26 47 33 42 50 43.2 72 42.8 88 42 102 41.2 110 34 110 22 110 10 101 2.4 86 1.8 66 .8 44 1 26 1.8 11 2.4 3.5 9 3 21Z" />
        </svg>
        <span>Contact</span>
      </a>
    </div>
    <div id="controls" class="controls" role="group" aria-label="Robot animation">
      <button id="toggle" type="button" aria-label="Pause">
        <svg class="icon-pause" viewBox="0 0 18 18" aria-hidden="true"><path d="M4.5 3.5h3v11h-3zM10.5 3.5h3v11h-3z" /></svg>
        <svg class="icon-play" viewBox="0 0 18 18" aria-hidden="true"><path d="M5 3v12l10-6z" /></svg>
      </button>
      <button id="reset" type="button" aria-label="Start again">
        <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M9 4A5.5 5.5 0 1 1 3.83 7.62M11 1.5 8.5 4 11 6.5" /></svg>
      </button>
      <div class="speeds" role="group" aria-label="Speed">
        <button type="button" data-speed="2" aria-pressed="false" aria-label="1× speed">1×</button>
        <button type="button" data-speed="3" aria-pressed="true" aria-label="2× speed">2×</button>
        <button type="button" data-speed="4" aria-pressed="false" aria-label="3× speed">3×</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
