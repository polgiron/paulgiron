<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e4e2de" />
    <meta name="description" content="Paul Giron" />
    <title>Paul Giron</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>
    <div class="identity">
      <h1>Paul Giron</h1>
      <a id="contact" class="contact" href="#" aria-live="polite"><span>Contact</span></a>
    </div>
    <div id="controls" class="controls" role="group" aria-label="Robot animation">
      <button id="toggle" type="button" aria-label="Pause">
        <svg class="icon-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3h3v10H4zM9 3h3v10H9z" /></svg>
        <svg class="icon-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.5v11l9-5.5z" /></svg>
      </button>
      <button id="reset" type="button" aria-label="Start again">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5a5.5 5.5 0 1 1-5.2 3.7l1.9.6A3.5 3.5 0 1 0 8 4.5v2.3L4 3.5 8 .2z" /></svg>
      </button>
      <div class="speeds" role="group" aria-label="Speed">
        <button type="button" data-speed="2" aria-pressed="false" aria-label="1× speed">1×</button>
        <button type="button" data-speed="3" aria-pressed="true" aria-label="2× speed">2×</button>
        <button type="button" data-speed="4" aria-pressed="false" aria-label="3× speed">3×</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
